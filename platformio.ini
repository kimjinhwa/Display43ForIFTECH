[env]
;platform = C:/Users/ServerManager/platform-espressif32
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = default
upload_port = COM3
monitor_port = COM3
test_port = COM3

; 4.3" Sunton ESP32-S3 RGB panel
; [env:esp32_Release]
; board = sunton_s3
; board_build.mcu = esp32s3
; board_build.f_cpu = 240000000L
; board_build.partitions = default_16MB.csv
; build_flags =
;     -D CONFIG_BLINK_GPIO=33
; 	-DCORE_DEBUG_LEVEL=1
; 	-DLOG_LEVEL=1
; 	-DBAUDRATEDEF=115200
; 	-DMODBUSMASTER
; 	-DDISPLAY_43
; lib_deps = 
; ;	makuna/RTC@^2.3.5
; 	miq19/eModbus@^1.4.1
; 	bblanchon/ArduinoJson @ ^7.2.1
; lib_ignore =
; 	ESPAsyncTCP
; 	ui_disp32

[env:IFTECH_DISP43]
board = sunton_s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
build_flags =
    -D CONFIG_BLINK_GPIO=33
    -DUSEWIFI
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LEVEL=3
	-DBAUDRATEDEF=115200
	-DMODBUSMASTER
	-DUSE_USB_SERIAL
	-DDISPLAY_43
	-D FW_UPDATE_BASE=\"http://ift.iptime.org:81/Esp32UploadFirmware\"
	-D FW_UPDATE_META=\"IFTECH_DISP43.json\"
	-USCREEN_CAPTURE
	; 화면 캡처(BLE CLI: scr). 대기 중 RAM은 늘지 않고, 요청 때만 가로 띠를 할당한다.
	; 현장 화면 기록용으로 배포 펌웨어에도 포함한다. 빼려면 이 줄을 지우거나
	; env:IFTECH_DISP43_noscr 로 빌드한다.
	-DSCREEN_CAPTURE
lib_deps = 
	; makuna/RTC@^2.3.5
	miq19/eModbus@^1.4.1
	bblanchon/ArduinoJson @ ^7.2.1
; ESPAsyncTCP는 ESP8266 전용 — eModbus 의존성으로 딸려 오면 ESP32 빌드 실패
; ui_disp32 는 3.2"용 — 이 env에서는 제외
lib_ignore =
	ESPAsyncTCP
	ui_disp32
; 버전 증가와 IIS(inetpub) / uploadFirmware 복사는 python versionup.py 만 한다.
; 이 env 의 일반 빌드와 USB 업로드는 Version.h 와 배포 폴더를 바꾸지 않는다.

; 화면 캡처만 뺀 USB 빌드. 앱 OTA 는 IFTECH_DISP43.json 만 받으므로 이 env 는 배포되지 않는다.
[env:IFTECH_DISP43_noscr]
extends = env:IFTECH_DISP43
build_flags =
	${env:IFTECH_DISP43.build_flags}
	-USCREEN_CAPTURE

; 3.2" LCDWiki — ESP32-WROOM-32E + ST7789 HSPI