[env]
;platform = C:/Users/ServerManager/platform-espressif32
platform = espressif32
framework = arduino
monitor_speed = 115200
monitor_filters = default
upload_port = COM3
monitor_port = COM3
test_port = COM3

; 4.3" Sunton ESP32-S3 RGB panel
[env:esp32_Release]
board = sunton_s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
build_flags =
    -D CONFIG_BLINK_GPIO=33
	-DCORE_DEBUG_LEVEL=1
	-DLOG_LEVEL=1
	-DBAUDRATEDEF=115200
	-DMODBUSMASTER
	-DDISPLAY_43
lib_deps = 
;	makuna/RTC@^2.3.5
	miq19/eModbus@^1.4.1
	bblanchon/ArduinoJson @ ^7.2.1
lib_ignore =
	ESPAsyncTCP
	ui_disp32

[env:IFTECH_DISP43]
board = sunton_s3
board_build.mcu = esp32s3
board_build.f_cpu = 240000000L
board_build.partitions = default_16MB.csv
build_flags =
    -D CONFIG_BLINK_GPIO=33
    -DUSEWIFI
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LEVEL=3
	-DBAUDRATEDEF=115200
	-DMODBUSMASTER
	-DUSE_USB_SERIAL
	-DDISPLAY_43
	-D FW_UPDATE_BASE=\"http://ift.iptime.org:81/Esp32UploadFirmware\"
	-D FW_UPDATE_META=\"IFTECH_DISP43.json\"
lib_deps = 
	; makuna/RTC@^2.3.5
	miq19/eModbus@^1.4.1
	bblanchon/ArduinoJson @ ^7.2.1
; ESPAsyncTCP는 ESP8266 전용 — eModbus 의존성으로 딸려 오면 ESP32 빌드 실패
; ui_disp32 는 3.2"용 — 이 env에서는 제외
lib_ignore =
	ESPAsyncTCP
	ui_disp32
extra_scripts =
	pre:pre_build.py
	pre:post_build.py

; 3.2" LCDWiki — ESP32-WROOM-32E + ST7789 HSPI
[env:IFTECH_DISP32]
board = esp32dev
board_build.mcu = esp32
board_build.f_cpu = 240000000L
board_build.partitions = huge_app.csv
board_upload.flash_size = 4MB
build_flags =
    -D CONFIG_BLINK_GPIO=33
    -DUSEWIFI
	-DCORE_DEBUG_LEVEL=3
	-DLOG_LEVEL=3
	-DBAUDRATEDEF=115200
	-DMODBUSMASTER
	-DDISPLAY_32
	-D FW_UPDATE_BASE=\"http://ift.iptime.org:81/Esp32UploadFirmware\"
	-D FW_UPDATE_META=\"IFTECH_DISP32.json\"
lib_deps = 
	; makuna/RTC@^2.3.5
	miq19/eModbus@^1.4.1
	bblanchon/ArduinoJson @ ^7.2.1
; ESPAsyncTCP는 ESP8266 전용 — eModbus 의존성으로 딸려 오면 ESP32 빌드 실패
; ui_disp43 는 4.3"용 — 이 env에서는 제외
lib_ignore =
	ESPAsyncTCP
	ui_disp43
extra_scripts =
	pre:pre_build.py
	pre:post_build.py
